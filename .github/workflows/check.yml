name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r skills/brand-partnership-pitch/requirements.txt
      - name: Check release files
        run: |
          python scripts/security_check.py --self-test
          python scripts/security_check.py
      - name: Run behavioral tests
        run: python -m unittest discover -s skills/brand-partnership-pitch/tests -v
      - name: Validate fictional fixture
        run: python skills/brand-partnership-pitch/scripts/brand_pitch.py validate --script skills/brand-partnership-pitch/examples/script.json
